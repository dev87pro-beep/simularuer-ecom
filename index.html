<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الشقق المفروشة المتكامل</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --success: #27ae60;
            --warning: #f39c12;
            --dark: #34495e;
            --border: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Header */
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { margin: 0; font-size: 1.4rem; }

        .header-actions { display: flex; gap: 10px; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
            font-size: 0.95rem;
        }

        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--secondary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--accent); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-edit { background: var(--secondary); color: white; padding: 5px 10px; font-size: 0.85rem; }
        .btn-delete { background: var(--accent); color: white; padding: 5px 10px; font-size: 0.85rem; }
        .btn-manage { background: var(--dark); color: white; padding: 5px 10px; font-size: 0.85rem; }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-top: 5px solid var(--secondary);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            borderBottom: 1px solid var(--light);
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        .card-header h3 { margin: 0; color: var(--primary); font-size: 1.2rem; }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.95rem;
        }

        .stat-label { color: #7f8c8d; }
        .stat-value { font-weight: bold; color: var(--primary); }
        .stat-value.success { color: var(--success); }
        .stat-value.warning { color: var(--warning); font-size: 1.1rem; }
        .stat-value.danger { color: var(--accent); }

        /* Table */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--light);
            color: var(--dark);
            font-weight: bold;
            white-space: nowrap;
        }

        tr:hover { background-color: #f8f9fa; }
        
        .total-row {
            background-color: var(--primary) !important;
            color: white;
            font-weight: bold;
        }
        .total-row td { border-bottom: none; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            background-color: white;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 { margin: 0; }
        .close-btn { font-size: 24px; cursor: pointer; color: white; }

        .modal-body { padding: 20px; }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--dark); }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus { border-color: var(--secondary); outline: none; }

        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group { flex: 1; }

        /* Manage Apartments List */
        .apt-list { list-style: none; padding: 0; }
        .apt-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }
        .apt-list li:last-child { border-bottom: none; }
        
        .edit-input { flex: 1; margin-left: 10px; padding: 8px; }

    </style>
</head>
<body>

    <header>
        <h1>🏠 نظام إدارة الشقق المفروشة</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="app.openBookingModal()">+ إضافة حجز جديد</button>
            <button class="btn btn-manage" onclick="app.openApartmentsModal()">⚙️ إدارة الشقق</button>
        </div>
    </header>

    <div class="container">
        
        <!-- Dashboard Cards -->
        <div id="dashboard-cards" class="dashboard-grid">
            <!-- Injected by JS -->
        </div>

        <!-- Bookings Table -->
        <div class="table-container">
            <div class="section-title">
                <h2>📊 سجل الحجوزات</h2>
                <select id="filter-apartment" onchange="app.render()" style="width:auto; padding:8px;">
                    <option value="all">جميع الشقق</option>
                </select>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>الشقة</th>
                        <th>التاريخ</th>
                        <th>الأيام</th>
                        <th>السعر/اليوم</th>
                        <th>إجمالي Airbnb</th>
                        <th>مبلغ المالك</th>
                        <th>عمولتي</th>
                        <th>المسلم</th>
                        <th>المتبقي</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="bookings-body">
                    <!-- Rows injected by JS -->
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="4">الإجمالي الكلي</td>
                        <td id="sum-airbnb">0</td>
                        <td id="sum-owner">0</td>
                        <td id="sum-commission">0</td>
                        <td id="sum-advance">0</td>
                        <td id="sum-reste">0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Modal: Add/Edit Booking -->
    <div id="booking-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-booking-title">إضافة حجز جديد</h3>
                <span class="close-btn" onclick="app.closeBookingModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="booking-form" onsubmit="app.saveBooking(event)">
                    <input type="hidden" id="booking-id">
                    
                    <div class="form-group">
                        <label>اختر الشقة</label>
                        <select id="apt-select" required></select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>الفترة (مثال: 21-28 Fév)</label>
                            <input type="text" id="b-date" required>
                        </div>
                        <div class="form-group">
                            <label>عدد الأيام</label>
                            <input type="number" id="b-days" required oninput="app.calcBookingMath()">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>السعر اليومي (Prix)</label>
                            <input type="number" id="b-price" required oninput="app.calcBookingMath()">
                        </div>
                        <div class="form-group">
                            <label>سعر المالك/اليوم (Comis Proprieter)</label>
                            <input type="number" id="b-owner-price" required oninput="app.calcBookingMath()">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>عمولتي/اليوم (Ma Comis)</label>
                            <input type="number" id="b-comm" required oninput="app.calcBookingMath()">
                        </div>
                        <div class="form-group">
                            <label>المبلغ المسلم (Avance)</label>
                            <input type="number" id="b-advance" required oninput="app.calcBookingMath()">
                        </div>
                    </div>

                    <div style="background:#f8f9fa; padding:15px; border-radius:5px; margin-bottom:15px; border:1px solid #eee;">
                        <div class="stat-row">
                            <span>إجمالي Airbnb:</span>
                            <span><strong id="calc-total-airbnb">0</strong> درهم</span>
                        </div>
                        <div class="stat-row">
                            <span>المتبقي (Reste):</span>
                            <span class="stat-value danger"><strong id="calc-reste">0</strong> درهم</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success" style="width:100%;">حفظ الحجز</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Manage Apartments -->
    <div id="apartments-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>إدارة الشقق</h3>
                <span class="close-btn" onclick="app.closeApartmentsModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form onsubmit="app.addApartment(event)" style="display:flex; gap:10px; margin-bottom:20px;">
                    <input type="text" id="new-apt-name" placeholder="اسم الشقة الجديدة" required style="flex:1;">
                    <button type="submit" class="btn btn-success">إضافة</button>
                </form>
                <hr>
                <h4>الشقق الحالية:</h4>
                <ul id="apartments-list" class="apt-list">
                    <!-- Injected by JS -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        const app = {
            // === 1. التهيئة والبيانات ===
            data: {
                apartments: ["Camping Elbarco", "Maison Mohamed Elgat"],
                bookings: [
                    // بيانات تجريبية بناءً على ملفك
                    { id: 1, apt: "Camping Elbarco", date: "21-28 Fév", days: 7, price: 246, ownerPrice: 220, comm: 25, advance: 1000 },
                    { id: 2, apt: "Camping Elbarco", date: "26-27 Fév", days: 1, price: 271, ownerPrice: 220, comm: 50, advance: 0 }
                ]
            },

            init: function() {
                // تحميل البيانات من الذاكرة المحلية إن وجدت
                const storedData = localStorage.getItem('appData');
                if (storedData) {
                    this.data = JSON.parse(storedData);
                }
                this.render();
            },

            saveData: function() {
                localStorage.setItem('appData', JSON.stringify(this.data));
            },

            // === 2. العرض (Rendering) ===
            render: function() {
                this.renderDashboard();
                this.renderTable();
                this.populateDropdowns();
            },

            populateDropdowns: function() {
                // قائمة التصفية في الجدول
                const filterSelect = document.getElementById('filter-apartment');
                const currentFilter = filterSelect.value;
                filterSelect.innerHTML = '<option value="all">جميع الشقق</option>';
                this.data.apartments.forEach(apt => {
                    const opt = document.createElement('option');
                    opt.value = apt;
                    opt.innerText = apt;
                    filterSelect.appendChild(opt);
                });
                if (this.data.apartments.includes(currentFilter)) filterSelect.value = currentFilter;

                // قائمة الشقق في نموذج الإضافة
                const formSelect = document.getElementById('apt-select');
                formSelect.innerHTML = '';
                this.data.apartments.forEach(apt => {
                    const opt = document.createElement('option');
                    opt.value = apt;
                    opt.innerText = apt;
                    formSelect.appendChild(opt);
                });
            },

            renderDashboard: function() {
                const container = document.getElementById('dashboard-cards');
                const grouped = {};

                // تجميع البيانات
                this.data.bookings.forEach(b => {
                    if (!grouped[b.apt]) {
                        grouped[b.apt] = { days: 0, revenue: 0, ownerTotal: 0, commTotal: 0, advance: 0 };
                    }
                    grouped[b.apt].days += b.days;
                    grouped[b.apt].revenue += (b.days * b.price);
                    grouped[b.apt].ownerTotal += (b.days * b.ownerPrice);
                    grouped[b.apt].commTotal += (b.days * b.comm);
                    grouped[b.apt].advance += b.advance;
                });

                container.innerHTML = '';
                this.data.apartments.forEach(aptName => {
                    const stats = grouped[aptName] || { days: 0, revenue: 0, ownerTotal: 0, commTotal: 0, advance: 0 };
                    const reste = stats.ownerTotal - stats.advance;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${aptName}</h3>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">📅 أيام الإشغال</span>
                            <span class="stat-value">${stats.days} يوم</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">💰 إيرادات Airbnb</span>
                            <span class="stat-value success">${stats.revenue.toLocaleString()} DH</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">🤝 حقوق المالك</span>
                            <span class="stat-value">${stats.ownerTotal.toLocaleString()} DH</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">💸 ربحيتك (العمولة)</span>
                            <span class="stat-value success">${stats.commTotal.toLocaleString()} DH</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">💵 تم تسليمه</span>
                            <span class="stat-value">${stats.advance.toLocaleString()} DH</span>
                        </div>
                        <div class="stat-row" style="background:#f8f8f8; padding:5px; border-radius:4px; margin-top:5px;">
                            <span class="stat-label"><strong>⚖️ المتبقي (Reste)</strong></span>
                            <span class="stat-value ${reste > 0 ? 'warning' : 'success'}"><strong>${reste.toLocaleString()} DH</strong></span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            },

            renderTable: function() {
                const tbody = document.getElementById('bookings-body');
                const filterVal = document.getElementById('filter-apartment').value;
                
                // حساب المجاميع
                const sums = { airbnb: 0, owner: 0, comm: 0, advance: 0, reste: 0 };
                
                // تصفية البيانات
                const filtered = filterVal === 'all' 
                    ? this.data.bookings 
                    : this.data.bookings.filter(b => b.apt === filterVal);

                tbody.innerHTML = '';
                
                filtered.forEach(b => {
                    const totalAirbnb = b.days * b.price;
                    const totalOwner = b.days * b.ownerPrice;
                    const totalComm = b.days * b.comm;
                    const reste = totalOwner - b.advance;

                    sums.airbnb += totalAirbnb;
                    sums.owner += totalOwner;
                    sums.comm += totalComm;
                    sums.advance += b.advance;
                    sums.reste += reste;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${b.apt}</td>
                        <td>${b.date}</td>
                        <td>${b.days}</td>
                        <td>${b.price}</td>
                        <td>${totalAirbnb.toLocaleString()}</td>
                        <td>${totalOwner.toLocaleString()}</td>
                        <td>${totalComm.toLocaleString()}</td>
                        <td>${b.advance.toLocaleString()}</td>
                        <td class="${reste > 0 ? 'stat-value warning' : 'stat-value success'}">${reste.toLocaleString()}</td>
                        <td>
                            <button class="btn-edit" onclick="app.editBooking(${b.id})">✏️</button>
                            <button class="btn-delete" onclick="app.deleteBooking(${b.id})">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // تحديث التذييل
                document.getElementById('sum-airbnb').innerText = sums.airbnb.toLocaleString();
                document.getElementById('sum-owner').innerText = sums.owner.toLocaleString();
                document.getElementById('sum-commission').innerText = sums.comm.toLocaleString();
                document.getElementById('sum-advance').innerText = sums.advance.toLocaleString();
                document.getElementById('sum-reste').innerText = sums.reste.toLocaleString();
            },

            // === 3. إدارة الحجوزات (CRUD) ===
            openBookingModal: function(id = null) {
                document.getElementById('booking-modal').style.display = 'flex';
                document.getElementById('booking-form').reset();
                document.getElementById('booking-id').value = '';
                document.getElementById('modal-booking-title').innerText = 'إضافة حجز جديد';
                this.populateDropdowns(); // تحديث القائمة

                if (id) {
                    const b = this.data.bookings.find(x => x.id === id);
                    if (b) {
                        document.getElementById('modal-booking-title').innerText = 'تعديل الحجز';
                        document.getElementById('booking-id').value = b.id;
                        document.getElementById('apt-select').value = b.apt;
                        document.getElementById('b-date').value = b.date;
                        document.getElementById('b-days').value = b.days;
                        document.getElementById('b-price').value = b.price;
                        document.getElementById('b-owner-price').value = b.ownerPrice;
                        document.getElementById('b-comm').value = b.comm;
                        document.getElementById('b-advance').value = b.advance;
                        this.calcBookingMath();
                    }
                }
            },

            closeBookingModal: function() {
                document.getElementById('booking-modal').style.display = 'none';
            },

            calcBookingMath: function() {
                const days = parseFloat(document.getElementById('b-days').value) || 0;
                const price = parseFloat(document.getElementById('b-price').value) || 0;
                const ownerPrice = parseFloat(document.getElementById('b-owner-price').value) || 0;
                const advance = parseFloat(document.getElementById('b-advance').value) || 0;

                const totalAirbnb = days * price;
                const totalOwner = days * ownerPrice;
                const reste = totalOwner - advance;

                document.getElementById('calc-total-airbnb').innerText = totalAirbnb.toLocaleString();
                document.getElementById('calc-reste').innerText = reste.toLocaleString();
            },

            saveBooking: function(e) {
                e.preventDefault();
                const id = document.getElementById('booking-id').value;
                
                const newBooking = {
                    id: id ? parseInt(id) : Date.now(),
                    apt: document.getElementById('apt-select').value,
                    date: document.getElementById('b-date').value,
                    days: parseInt(document.getElementById('b-days').value),
                    price: parseFloat(document.getElementById('b-price').value),
                    ownerPrice: parseFloat(document.getElementById('b-owner-price').value),
                    comm: parseFloat(document.getElementById('b-comm').value),
                    advance: parseFloat(document.getElementById('b-advance').value)
                };

                if (id) {
                    const index = this.data.bookings.findIndex(b => b.id == id);
                    this.data.bookings[index] = newBooking;
                } else {
                    this.data.bookings.push(newBooking);
                }

                this.saveData();
                this.closeBookingModal();
                this.render();
            },

            deleteBooking: function(id) {
                if(confirm('هل أنت متأكد من حذف هذا الحجز؟ لا يمكن التراجع عن هذا الإجراء.')) {
                    this.data.bookings = this.data.bookings.filter(b => b.id !== id);
                    this.saveData();
                    this.render();
                }
            },

            editBooking: function(id) {
                this.openBookingModal(id);
            },

            // === 4. إدارة الشقق (Settings) ===
            openApartmentsModal: function() {
                this.renderApartmentsList();
                document.getElementById('apartments-modal').style.display = 'flex';
            },

            closeApartmentsModal: function() {
                document.getElementById('apartments-modal').style.display = 'none';
            },

            renderApartmentsList: function() {
                const list = document.getElementById('apartments-list');
                list.innerHTML = '';
                
                this.data.apartments.forEach((apt, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${apt}</span>
                        <div>
                            <button class="btn-edit" onclick="app.editAptName(${index}, this)">✏️ تعديل</button>
                            <button class="btn-delete" onclick="app.deleteApt(${index})">🗑️</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            },

            addApartment: function(e) {
                e.preventDefault();
                const input = document.getElementById('new-apt-name');
                const name = input.value.trim();
                if (name && !this.data.apartments.includes(name)) {
                    this.data.apartments.push(name);
                    this.saveData();
                    this.render();
                    this.renderApartmentsList(); // تحديث القائمة داخل النافذة
                    input.value = ''; // تفريغ الحقل
                } else {
                    alert("اسم الشقة موجود مسبقاً أو فارغ!");
                }
            },

            deleteApt: function(index) {
                const aptName = this.data.apartments[index];
                // التحقق من وجود حجوزات مرتبطة
                const hasBookings = this.data.bookings.some(b => b.apt === aptName);
                
                if (hasBookings) {
                    alert("لا يمكن حذف هذه الشقة لوجود حجوزات مرتبطة بها. احذف الحجوزات أولاً.");
                    return;
                }
                
                if(confirm(`هل أنت متأكد من حذف شقة "${aptName}"؟`)) {
                    this.data.apartments.splice(index, 1);
                    this.saveData();
                    this.render();
                    this.renderApartmentsList();
                }
            },

            editAptName: function(index, btn) {
                const currentName = this.data.apartments[index];
                const li = btn.parentElement.parentElement;
                
                // استبدال النص بحقل إدخال
                li.innerHTML = `
                    <input type="text" class="edit-input" value="${currentName}">
                    <div>
                        <button class="btn btn-success" onclick="app.saveAptName(${index}, this)">حفظ</button>
                        <button class="btn btn-danger" onclick="app.renderApartmentsList()">إلغاء</button>
                    </div>
                `;
            },

            saveAptName: function(index, btn) {
                const li = btn.parentElement.parentElement;
                const newName = li.querySelector('input').value.trim();
                const oldName = this.data.apartments[index];

                if (newName && newName !== oldName) {
                    // تحديث اسم الشقة في القائمة
                    this.data.apartments[index] = newName;
                    
                    // تحديث اسم الشقة في جميع الحجوزات المرتبطة
                    this.data.bookings.forEach(b => {
                        if(b.apt === oldName) b.apt = newName;
                    });

                    this.saveData();
                    this.render(); // إعادة تحديث كل شيء
                }
                this.renderApartmentsList(); // العودة للعرض العادي
            }
        };

        // بدء التطبيق
        app.init();
    </script>
</body>
</html>
